<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Tower Defense</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameContainer">    
        <div class="canvasContainer">
            <canvas class="canvasDeco" id="mapCanvas" height="540" width="918"></canvas>
            <canvas class="canvasDeco" id="bookCanvas" height="540" width="918"></canvas>
            <canvas class="canvasDeco" id="towerCanvas" height="540" width="918"></canvas>
            <canvas class="canvasDeco" id="towerPlaceCanvas" height="540" width="918"></canvas>
            <canvas class="canvasDeco" id="projectileCanvas" height="540" width="918"></canvas>
            <canvas class="canvasDeco" id="uiCanvas" height="540" width="918"></canvas>

            <div id="upgradeTab" class="hideUpgrade">
                <div class="image"></div>
                <div class="towerName"></div>
                <div class="descriptionUpgrade"></div>
                <div class="upgrade"></div>
            </div>
        </div>
        <div id="sideTab">
            <div id="towersTab">
                <div id="top">
                    <h2>Towers</h2>
                </div>
                <div class="towers">
                    <div class="tower" id="1" title="Johnny | Basic Tower">
                        <img src="sprites/tower1.png" draggable="false">
                        <p>$ 200</p>
                    </div>
                    <div class="tower" id="2" title="Teduded | Damage Dealer">
                        <img src="sprites/tower2.png" draggable="false">
                        <p>$ 400</p>
                    </div>
                    <div class="tower" id="3" title="Fabbe | Sniper">
                        <img src="sprites/tower3.png" draggable="false">
                        <p>$ 200</p>
                    </div>
                    <div class="tower" id="4" title="Fifika | Freeze">
                        <img src="sprites/tower4.png" draggable="false">
                        <p>$ 500</p>
                    </div>
                    <div class="tower" id="5" title="Beast | Fast">
                        <img src="sprites/tower5.png" draggable="false">
                        <p>$ 800</p>
                    </div>
                    <div class="tower" id="6" title="Wilhanson | Glue">
                        <img src="sprites/tower6.png" draggable="false">
                        <p>$ 300</p>
                    </div>
                    <div class="tower" id="7" title="Vigor | Poison">
                        <img src="sprites/tower7.png" draggable="false">
                        <p>$ 1200</p>
                    </div>
                    <div class="tower" id="8" title="Howarts | Super">
                        <img src="sprites/tower8.png" draggable="false">
                        <p>$ 4000</p>
                    </div>
                </div>
            </div>
            <div id="buttons">
                <div id="changeLogBtn" title="View Changelog">
                    <img src="svg/scroll-solid-full.svg" class="svg">
                </div>
                <div id="pauseBtn" title="Resume Game">
                    <img src="svg/play-solid-full.svg" class="svg">
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
