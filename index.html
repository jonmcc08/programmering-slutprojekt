<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Tower Defense</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameContainer">    
        <div class="canvasContainer">
            <canvas class="canvasDeco" id="mapCanvas" height="540" width="918"></canvas>
            <canvas class="canvasDeco" id="bookCanvas" height="540" width="918"></canvas>
            <canvas class="canvasDeco" id="towerCanvas" height="540" width="918"></canvas>
            <canvas class="canvasDeco" id="towerPlaceCanvas" height="540" width="918"></canvas>
            <canvas class="canvasDeco" id="projectileCanvas" height="540" width="918"></canvas>
            <canvas class="canvasDeco" id="uiCanvas" height="540" width="918"></canvas>

            <div id="upgradeTab" class="hideUpgrade">
                <div class="image">
                
                </div>
                <div class="upgrade">

                </div>
            </div>
        </div>
        <div id="sideTab">
            <div id="towersTab">
                <div id="top">
                    <h2>Towers</h2>
                </div>
                <div class="towers">
                    <div class="tower" id="1">
                        <img src="sprites/tower1.png" draggable="false">
                        <p>$ 200</p>
                    </div>
                    <div class="tower" id="2">
                        <img src="sprites/tower2.png" draggable="false">
                        <p>$ 400</p>
                    </div>
                    <div class="tower" id="3">
                        <img src="sprites/tower1.png" draggable="false">
                        <p>$ 800</p>
                    </div>
                    <div class="tower" id="10">
                        <img src="sprites/tower10.png" draggable="false">
                        <p>$ 4000</p>
                    </div>
                </div>
            </div>
            <div id="buttons">

            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
